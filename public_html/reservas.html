<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reservas · tukermes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="tukermes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwindConfig.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen pb-16 font-sans antialiased">

  <header class="glass-bar sticky top-0 z-[1100]">
    <div class="wrap flex items-center gap-3 py-3">
      <a href="panel.html" class="icon-btn flex-none" aria-label="Volver a mi panel">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div class="min-w-0 flex-1">
        <h1 class="text-base font-extrabold leading-tight">Reservas y entregas</h1>
        <p id="pos-title" class="truncate text-xs font-semibold text-muted"></p>
      </div>
      <a data-link="entregar.html" href="panel.html" class="btn btn-primary !h-10 flex-none !px-3.5 text-[13px]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
        Escanear
      </a>
    </div>
  </header>

  <div id="pos-notfound" class="mx-auto hidden max-w-xl px-4 py-20 text-center">
    <h2 class="text-2xl font-extrabold">No encontramos esta kermés</h2>
    <p class="mt-2 text-muted">Puede que pertenezca a otra cuenta.</p>
    <a href="panel.html" class="btn btn-primary mt-6">Volver a mi panel</a>
  </div>

  <main id="res-main" class="wrap space-y-5 pt-4">
    <div class="h-40 animate-pulse rounded-[26px] bg-line"></div>
  </main>

  <dialog id="ticket-dialog" class="sheet-dialog !bg-canvas" aria-labelledby="ticket-dialog-title">
    <div class="flex items-center justify-between px-5 pb-1 pt-4">
      <h2 id="ticket-dialog-title" class="text-lg font-extrabold">Ticket</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="max-h-[70vh] overflow-y-auto px-4 pb-2 pt-2"><div id="ticket-view"></div></div>
    <div class="grid grid-cols-2 gap-2 px-4 pb-4 pt-2">
      <a id="ticket-wa" href="#" target="_blank" rel="noopener" class="btn btn-whatsapp"><svg class="h-5 w-5 flex-none" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>WhatsApp</a>
      <button type="button" id="ticket-download" class="btn btn-outline">Descargar</button>
    </div>
  </dialog>

  <script type="module" src="js/reservas.js"></script>
  <script src="js/ui/fluid.js" defer></script>
</body>
</html>
