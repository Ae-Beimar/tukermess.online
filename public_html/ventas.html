<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ventas · tukermes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="tukermes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwindConfig.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen pb-16 font-sans antialiased" data-view="ventas">

  <header class="glass-bar sticky top-0 z-[1100]">
    <div class="wrap flex items-center gap-3 py-3">
      <a href="panel.html" class="icon-btn flex-none" aria-label="Volver a mi panel">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div class="min-w-0 flex-1">
        <h1 class="text-base font-extrabold leading-tight">Ventas</h1>
        <p id="pos-title" class="truncate text-xs font-semibold text-muted"></p>
      </div>
      <a data-link="vender.html" href="panel.html" class="btn btn-primary !h-11 flex-none !px-4">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
        Vender
      </a>
    </div>
    <p id="sync" class="wrap flex items-center gap-1.5 pb-2 text-xs font-semibold text-muted" aria-live="polite"></p>
  </header>

  <div id="pos-notfound" class="mx-auto hidden max-w-xl px-4 py-20 text-center">
    <h2 class="text-2xl font-extrabold">No encontramos esta kermés</h2>
    <p class="mt-2 text-muted">Puede que pertenezca a otra cuenta o que no tengas señal la primera vez que la abres.</p>
    <a href="panel.html" class="btn btn-primary mt-6">Volver a mi panel</a>
  </div>

  <main id="pos-main" class="wrap pt-4"></main>

  <script type="module" src="js/vender.js"></script>
  <script src="js/ui/fluid.js" defer></script>
</body>
</html>
