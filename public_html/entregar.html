<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entregar · tukermes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="tukermes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwindConfig.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen pb-16 font-sans antialiased">

  <header class="glass-bar sticky top-0 z-[1100]">
    <div class="wrap flex items-center gap-3 py-3">
      <a href="panel.html" class="icon-btn flex-none" aria-label="Volver a mi panel">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div class="min-w-0 flex-1">
        <h1 class="text-base font-extrabold leading-tight">Entregar</h1>
        <p id="pos-title" class="truncate text-xs font-semibold text-muted"></p>
      </div>
      <a data-link="reservas.html" href="panel.html" class="btn btn-outline !h-10 flex-none !px-3.5 text-[13px]">Reservas</a>
    </div>
  </header>

  <div id="pos-notfound" class="mx-auto hidden max-w-xl px-4 py-20 text-center">
    <h2 class="text-2xl font-extrabold">No encontramos esta kermés</h2>
    <p class="mt-2 text-muted">Puede que pertenezca a otra cuenta.</p>
    <a href="panel.html" class="btn btn-primary mt-6">Volver a mi panel</a>
  </div>

  <main id="deliver-main" class="wrap mx-auto max-w-xl space-y-4 pt-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="panel px-4 py-3">
        <p class="text-xs font-semibold text-muted">Por entregar</p>
        <p id="stat-pending" class="num text-2xl font-extrabold">–</p>
      </div>
      <div class="panel px-4 py-3">
        <p class="text-xs font-semibold text-muted">Entregadas</p>
        <p id="stat-delivered" class="num text-2xl font-extrabold">–</p>
      </div>
    </div>

    <!-- Lector -->
    <section id="scan-view" class="space-y-4" aria-label="Lector de QR">
      <div class="scanner">
        <video id="video" playsinline muted aria-hidden="true"></video>
        <div id="scan-overlay" class="hidden"><div class="scanner-frame"></div><div class="scanner-line"></div></div>
        <div id="scan-msg" class="scanner-msg">
          <p class="text-sm font-semibold text-white/80">Preparando la cámara…</p>
        </div>
      </div>
      <p class="text-center text-sm text-muted">Apunta al QR del ticket del cliente.</p>
      <form id="code-form" class="panel flex items-end gap-2 p-3" novalidate>
        <div class="min-w-0 flex-1">
          <label class="field-label" for="code-input">¿No lee el QR? Escribe el código</label>
          <input id="code-input" class="input num uppercase tracking-[0.12em]" maxlength="11" autocomplete="off" autocapitalize="characters" placeholder="ABCDE-12345">
        </div>
        <button type="submit" class="btn btn-dark !h-[46px] flex-none !px-5">Buscar</button>
      </form>
    </section>

    <!-- Resultado -->
    <section id="result-view" class="hidden space-y-4" aria-live="polite"></section>
  </main>

  <script type="module" src="js/entregar.js"></script>
  <script src="js/ui/fluid.js" defer></script>
</body>
</html>
